# Default HTTP port. 8080 is avoided on purpose because it often collides with
# other local servers (e.g. WildFly). Override with SERVER_PORT or --server.port.
server:
  port: 8963
  # Behind Caddy (deploy/Caddyfile) HTTPS ends at the proxy, which forwards over plain HTTP on
  # loopback with X-Forwarded-Proto/-Host/-For. "native" lets Tomcat's RemoteIpValve apply them, so
  # generated absolute URLs (e.g. the OpenAPI "servers" entry used by Swagger UI's "Try it out")
  # are https://<public host> instead of http://. The valve only trusts those headers from internal
  # proxy addresses (loopback and private ranges by default); the app publishes its port on
  # 127.0.0.1 only, so no client can reach it directly to spoof them.
  forward-headers-strategy: native
  tomcat:
    # Bounded concurrency keeps thread stacks, per-request heap and /tmp usage
    # inside the container memory budget (see Dockerfile). Override with
    # SERVER_TOMCAT_THREADS_MAX / SERVER_TOMCAT_ACCEPT_COUNT.
    threads:
      max: 20
    accept-count: 20
    # T26b: longest Tomcat waits for the next bytes of a request. The analysis permit is taken before
    # the multipart body is read, so a client that stops sending would hold it for Tomcat's 60 s default
    # (and keep-alive idle time). A client that keeps trickling bytes is cut by the reverse proxy
    # (read_body in deploy/Caddyfile). Override with SERVER_TOMCAT_CONNECTION_TIMEOUT.
    connection-timeout: 20s

spring:
  application:
    name: pdf-validator
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 81MB
      # Uploads are buffered on disk (tmpfs /tmp in the container), never in the heap:
      # threshold 0 = every part goes straight to a temp file. The bulkhead below admits
      # at most `max-concurrent` uploads at once, which bounds /tmp use (numbers in the
      # README memory budget table). Location is explicit so it is obvious what must
      # stay writable.
      file-size-threshold: 0B
      location: ${java.io.tmpdir}

# PDFBox logs a WARN per text run when a standard font (e.g. Helvetica) is not embedded and it
# substitutes one; PDFs like that are common and it floods the log, so only errors are shown.
logging:
  level:
    org.apache.pdfbox.pdmodel.font: ERROR

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed; every other actuator endpoint
        # (env, beans, threaddump, ...) stays off by default.
        include: health,info

# Bulkhead (T12c): limits simultaneous PDF analyses (upload buffering + analysis) so
# worst-case memory stays inside the 512 MB container budget. A request waits up to
# acquire-timeout for a slot, otherwise the API answers 503 (urn:pdfvalidator:error:busy)
# with a Retry-After header. Tomcat threads.max/accept-count (above) only queue requests;
# this is what actually bounds memory. Override with PDFVALIDATOR_ANALYSIS_MAX_CONCURRENT
# and PDFVALIDATOR_ANALYSIS_ACQUIRE_TIMEOUT.
pdfvalidator:
  analysis:
    max-concurrent: 2
    acquire-timeout: 30s
    # T20 resource caps against hostile PDFs: a cap never fails the request, it truncates the result and
    # the report says so (pagesTruncated, revisionCountLowerBound, ...). Defaults shown; override with
    # PDFVALIDATOR_ANALYSIS_MAX_PAGES etc.
    max-pages: 1000               # pages whose details are returned (the total is still reported)
    max-revision-markers: 1000000 # occurrences of stream/startxref//Prev collected when counting revisions
    max-revisions: 10000          # xref sections followed by the revision walk
    max-signature-fields: 50      # signature fields analysed; more => ANALYSIS_INCOMPLETE, never VALID
    max-certificates-per-signature: 50 # certificates taken from one CMS
    max-chain-length: 10          # certificates linked signer-to-root when ordering a chain
    max-pdfa-issues: 200          # distinct PDF/A issues kept; the rest become one TRUNCATED issue

# Trust store used by CertificateChainValidator (PkixCertificateChainValidator)
# to validate a signer's certificate chain. All properties are optional: the
# bundled anchors (src/main/resources/truststore/, generated from the Spanish
# Trusted List by the TslSync maintainer tool) are
# always loaded; an external directory and/or a PKCS#12 file are additive on
# top of them, never a replacement. Uncomment and set to add custom roots
# without touching the code -- see README section 2.7/4.
#pdfvalidator:
#  truststore:
#    external-dir: /path/to/a/directory/with/one-certificate-per-file
#    pkcs12-path: /path/to/truststore.p12
#    pkcs12-password: change-me

# Optional revocation checking (OCSP/CRL, CompositeRevocationChecker), only
# used when a request sets checkRevocation=true. Every non-anchor certificate
# of the validated path is checked, under ONE shared deadline per signature.
# The defaults below already apply; uncomment only to change them -- see the
# README sections on revocation checking (2.8) and configuration (4).
#pdfvalidator:
#  revocation:
#    timeout: 2s                  # cap for one request (DNS + connect + response)
#    total-timeout: 6s            # one deadline for the whole check of a signature (all certificates, OCSP and CRL)
#    max-response-bytes: 10MB     # maximum OCSP/CRL response body
#    max-urls-per-method: 3       # AIA (OCSP) / CDP (CRL) URLs tried per certificate, after de-duplication
#    max-header-line-bytes: 8KB   # longest accepted HTTP response line (status, header, trailer)
#    max-headers: 100             # most response headers (and, separately, chunk trailers)
#    max-header-bytes: 64KB       # combined size of the response headers (and of the trailers)
