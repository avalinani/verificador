# Caddy HTTPS proxy, run next to the app stack:
#   docker compose -f deploy/docker-compose.caddy.yml up -d
# Needs ports 80 and 443 open (HTTP-01 challenge + HTTPS). It runs on the host
# network so `localhost:8963` in the Caddyfile reaches the app even when the app
# publishes its port on 127.0.0.1 only. Certificates persist in caddy_data.
# Keep the same Compose project name on every deploy (the directory name by default,
# or -p <name>): the certificates live in the <project>_caddy_data volume, and a new
# project name means a new empty volume and a fresh Let's Encrypt issuance (rate-limited).
# The reference VPS runs it from ~/https (project "https", volume https_caddy_data).
# The image is pinned by digest (multi-arch index, pinned 2026-09-30; the tag is kept for
# readability). To refresh: `docker buildx imagetools inspect caddy:2` and copy the digest.
services:
  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
